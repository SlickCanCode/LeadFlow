spring.application.name=lead-revenue-automation-system
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.models=${OPENAI_MODELS:}
ai.gemini.models=${GEMINI_MODELS:gemini-3.0-flash, gemini-2.5-flash, gemini-2.0-flash}
ai.chat.max-output-tokens=${AI_CHAT_MAX_OUTPUT_TOKENS:768}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.model.chat=google-genai
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
whatsapp.webhook.verify-token=${WHATSAPP_VERIFY_TOKEN:${random.uuid}}
